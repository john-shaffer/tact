name = "json mismatch is detected"

[setup.files."inner.toml"]
content = """
name = "Inner with json mismatch"

[setup.files."data.json"]
content = '{"a":1}'

[[steps]]
run = "true"

[steps.expected]
exit-code = 0

[steps.expected.files."data.json"]
json = '{"a":2}'
"""

[[steps]]
run = "tact inner.toml"

