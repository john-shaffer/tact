name = "JSON output captures failure details"

[setup.files."inner.toml"]
content = """
name = "Failing inner scenario"

[[steps]]
run = "echo wrong"

[steps.expected]
exit-code = 0
stdout = "right\\n"
"""

[[steps]]
run = "tact --output result.json inner.toml"

[steps.expected]
exit-code = 1

[steps.expected.files."result.json"]
json-open = """
{
  "summary": {"pass": 0, "fail": 1},
  "scenarios": [{"name": "Failing inner scenario", "status": "fail", "checks": [{"check": "stdout", "status": "fail"}]}]
}
"""
