name = "env sets variables for steps"

[env]
GREETING = "hello"
DATA_DIR = "${TACT_WORK_DIR}/data"
UNSET = "[${TACT_NO_SUCH_VARIABLE}]"

[[steps]]
run = 'echo "$GREETING $UNSET" && mkdir "$DATA_DIR" && touch "$DATA_DIR/x"'

[steps.expected]
stdout = "hello []\n"

[steps.expected.files."data/x"]
exists = true

[[steps]]
run = 'echo "$GREETING $NAME"'

[steps.env]
GREETING = "${GREETING}, world"
NAME = "tact"

[steps.expected]
stdout = "hello, world tact\n"

[[steps]]
run = 'echo "$GREETING ${NAME-unset}"'

[steps.expected]
stdout = "hello unset\n"

[[steps]]
run = 'test "$OUTER_PATH" = "$PATH" && test "$PORT" = 8080 && test "$TACT_WORK_DIR" = "$PWD"'

[steps.env]
OUTER_PATH = "${PATH}"
PORT = 8080
