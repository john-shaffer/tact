name = "JSON output flag writes a run summary"

[setup.files."inner.toml"]
content = """
name = "Simple inner scenario"

[[steps]]
run = "echo ok"

[steps.expected]
exit-code = 0
stdout = "ok\\n"
"""

[[steps]]
run = "tact --output result.json inner.toml"

[steps.expected]
exit-code = 0

[steps.expected.files."result.json"]
json-open = """
{
  "summary": {"pass": 1, "fail": 0},
  "scenarios": [{"name": "Simple inner scenario", "status": "pass", "checks": []}]
}
"""
