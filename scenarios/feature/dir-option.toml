name = "--dir option runs scenario in specified directory"

[setup.files."inner.toml"]
content = """
name = "Write a file in the work dir"

[[steps]]
run = "echo hello > output.txt"

[steps.expected]
exit-code = 0
"""

[[steps]]
run = "tact --dir ./mydir inner.toml"

[steps.expected]
exit-code = 0

[[steps]]
run = "cat mydir/output.txt"

[steps.expected]
exit-code = 0
stdout = "hello\n"
