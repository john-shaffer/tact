name = "JSON output captures failure details"

[setup.files."inner.toml"]
content = """
name = "Failing inner scenario"

[[steps]]
run = "echo wrong"

[steps.expected]
exit-code = 0
stdout = "right\\n"
"""

[[steps]]
run = "tact --output result.json inner.toml"

[steps.expected]
exit-code = 1

[[steps]]
run = "jq '{summary,scenarios:[.scenarios[]|{name,path,status,checks:[.checks[]|{check,status}]}]}' result.json > normalized.json"

[steps.expected]
exit-code = 0

[steps.expected.files."normalized.json"]
json-content = """
{
  "summary": {
    "pass": 0,
    "fail": 1,
    "error": 0,
    "skip": 0
  },
  "scenarios": [
    {
      "name": "Failing inner scenario",
      "path": "inner.toml",
      "status": "fail",
      "checks": [
        {
          "check": "stdout",
          "status": "fail"
        }
      ]
    }
  ]
}
"""
